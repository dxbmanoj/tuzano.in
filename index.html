
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c30">

  <meta name="description"
        content="Tuzano is loading. Where Founders Meet Capital & Expertise.">

  <title>| Where Founders Meet Capital &amp; Expertise</title>

  <style>
    :root {
      --navy: #101c30;
      --gold: #c5a66b;
      --white: #ffffff;
      --muted: #d4dae4;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--navy);
      color: var(--white);
    }

    .landing {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      position: relative;
      overflow: hidden;
    }

    .content {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    .brand {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 58px;
    }

    .brand span {
      color: var(--gold);
    }

    .loading {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(38px, 6.5vw, 68px);
      line-height: 1.16;
      font-weight: 600;
      letter-spacing: -1.5px;
      margin: 0;
    }

    h1 span {
      display: block;
      color: var(--gold);
      margin-top: 8px;
    }

    .divider {
      width: 62px;
      height: 2px;
      background: var(--gold);
      margin: 38px auto;
    }

    h2 {
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 500;
      margin: 0 0 14px;
    }

    .message {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
      max-width: 650px;
      margin: 0 auto;
    }

    .contact {
      margin-top: 35px;
      font-size: 15px;
      color: var(--muted);
    }

    .contact a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      margin-left: 5px;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #aab4c4;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .landing {
        padding: 40px 22px 65px;
      }

      .brand {
        font-size: 22px;
        margin-bottom: 48px;
      }

      .loading {
        font-size: 11px;
        letter-spacing: 3px;
      }

      h1 {
        letter-spacing: -0.7px;
      }

      .divider {
        margin: 30px auto;
      }

      .message {
        font-size: 15px;
      }

      .contact {
        font-size: 14px;
        line-height: 2;
      }

      .contact a {
        display: inline-block;
      }
    }
  </style>
</head>

<body>
  <main class="landing">
    <div class="content">

     <div class="loading">Tuzano is loading ......!</div>

      <h1>
        Where Founders Meet
        <span>Capital &amp; Expertise</span>
      </h1>

      <div class="divider"></div>

      <h2>Have a Business or Investment Opportunity?</h2>

      <p class="message">
        We welcome conversations with founders, business owners
        and potential strategic partners.
      </p>

      <div class="contact">
        Contact:
        <a href="mailto:hello@tuzano.in">hello@tuzano.in</a>
      </div>

    </div>

    <footer>
      &copy; 2026 Tuzano Capital Advisory LLP
    </footer>
  </main>
</body>
</html>
